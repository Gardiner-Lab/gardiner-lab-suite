# Build the Plasmid Editor from a working copy instead of pulling its published
# image. Useful before a release, and for testing a change against the stack:
#
#   SECRET_KEY=dev MOCLO_SECRET_KEY=dev \
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# EDITOR_SRC points at the checkout (default: a sibling directory).

services:
  editor:
    build:
      context: ${EDITOR_SRC:-../plasmid-editor}
    image: plasmid-editor:local
    pull_policy: never
