# Build images from source instead of pulling the published ones: the MoClo
# Library Tool and the Plasmid Editor from working copies, and the sign-in and
# backup services from ./portal and ./backup. Used before
# a release, for testing a change against the stack, and by install.sh while an
# image has not been published yet.
#
#   SECRET_KEY=dev MOCLO_SECRET_KEY=dev \
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# MOCLO_SRC, EDITOR_SRC, NOTEBOOK_SRC, SEEDS_SRC and STOCKS_SRC point at the
# checkouts (default: sibling directories).

services:
  portal:
    build: ./portal
    image: lab-suite-portal:local
    pull_policy: never

  moclo:
    build:
      context: ${MOCLO_SRC:-../moclo-library-tool}
    image: moclo-library-tool:local
    pull_policy: never

  editor:
    build:
      context: ${EDITOR_SRC:-../plasmid-editor}
    image: plasmid-editor:local
    pull_policy: never

  notebook:
    build:
      context: ${NOTEBOOK_SRC:-../lab-notebook}
    image: lab-notebook:local
    pull_policy: never

  seeds:
    build:
      context: ${SEEDS_SRC:-../seed-bank}
    image: seed-bank:local
    pull_policy: never

  stocks:
    build:
      context: ${STOCKS_SRC:-../lab-stocks}
    image: lab-stocks:local
    pull_policy: never

  backup:
    build: ./backup
    image: lab-suite-backup:local
    pull_policy: never

  backup-console:
    image: lab-suite-backup:local
    pull_policy: never

  restore:
    image: lab-suite-backup:local
    pull_policy: never
