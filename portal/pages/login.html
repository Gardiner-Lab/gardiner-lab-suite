<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Trellis Tools</title>
<link rel="icon" type="image/svg+xml" href="/account/trellis.svg">
<link rel="stylesheet" href="trellis.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="tt centred">
<main class="card">
  <h1><img class="brand" src="trellis.svg" alt=""> Trellis Tools</h1>
  <p class="hint lead">Sign in, or create an account, to use the lab's tools. One account works in
    all of them.</p>
  <div id="alert" role="alert"></div>
  <div id="demo"></div>
  <form id="form">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn wide" id="submit" type="submit">Sign in</button>
  </form>
  <div class="foot">
    <a id="register" href="register">Create an account</a>
  </div>
</main>
<script>
const next = new URLSearchParams(location.search).get('next') || '';
if (next) document.getElementById('register').href = `register?next=${encodeURIComponent(next)}`;

function showError(message) {
  const box = document.createElement('div');
  box.className = 'alert bad';
  box.textContent = message;
  document.getElementById('alert').replaceChildren(box);
}

fetch('api/session', { cache: 'no-store' }).then((r) => r.json()).then((s) => {
  if (!s.registration_open) document.getElementById('register').hidden = true;
  // A server with a teaching account may offer it here.
  if (s.demo) {
    const box = document.createElement('div');
    box.className = 'alert good';
    const use = document.createElement('button');
    use.type = 'button';
    use.className = 'btn-link';
    use.textContent = 'Fill it in';
    use.addEventListener('click', () => {
      document.getElementById('username').value = s.demo.username;
      document.getElementById('password').value = s.demo.password;
      document.getElementById('submit').focus();
    });
    box.append('Just looking? Try the demo lab: username ', Object.assign(document.createElement('b'), { textContent: s.demo.username }),
      ', password ', Object.assign(document.createElement('b'), { textContent: s.demo.password }), '. ', use);
    document.getElementById('demo').replaceChildren(box);
  }
}).catch(() => {});

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = document.getElementById('submit');
  button.disabled = true;
  try {
    const res = await fetch('api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        next,
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Sign-in failed (${res.status})`);
    location.href = body.next || '/';
  } catch (err) {
    showError(err.message);
    button.disabled = false;
  }
});
</script>
</body>
</html>
