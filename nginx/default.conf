# Routing for the Gardiner Lab tool suite.
#
# The MoClo Library Tool writes absolute links (href="/parts",
# fetch('/api/backbones')), so it keeps the whole root namespace and needs no
# changes and no response rewriting. Every other tool is carved out under its
# own prefix and is told about that prefix, so its own links come out right.
#
#   =/            landing page (static)
#   /account/     Sign-in for the whole suite (served at its own root)
#   /editor/      Plasmid Editor    (URL_PREFIX=/editor)
#   /notebook/    Lab Notebook      (URL_PREFIX=/notebook)
#   /seeds/       Seed Bank         (URL_PREFIX=/seeds)
#   /stocks/      Lab Stocks        (URL_PREFIX=/stocks)
#   /backup/      Backup console    (served at its own root)
#   /             MoClo Library Tool (catch-all)
#
# One sign-in for every tool: before each request, the proxy asks the sign-in
# service who is signed in and passes the answer on as X-Suite-User. A tool
# started with SUITE_AUTH=proxy takes that header as the person's identity. The
# header is always set here, so a browser cannot supply its own. Nobody sees
# the landing page or any tool before signing in or registering.
#
# To add a tool: add a service to docker-compose.yml, copy the /editor block
# below and change the prefix and host name, then add an entry to
# landing/tools.json. Put new blocks ABOVE the catch-all.
#
# Backends are addressed through Docker's embedded DNS at request time, using a
# variable in proxy_pass, rather than being resolved once at start-up. That way
# recreating a single container - updating one tool, say - does not leave this
# proxy pointing at an address that no longer exists until it is restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# Signing in and registering, against guessing: from any one address, at most
# 10 tries a minute, with a burst of 10 more at once; beyond that, 429. Only the
# tries (POST): the pages themselves load freely. The sign-in service also stops
# one address guessing one account's password (portal.py, GUESSES). Behind
# another proxy (a university load balancer), every visitor would share that
# proxy's address: set real_ip_header and set_real_ip_from for it first.
map $request_method $suite_signin_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $suite_signin_key zone=suite_signin:10m rate=10r/m;

# Long sequences and chromatograms travel in request bodies.
client_max_body_size 64m;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Who is signed in, as the sign-in service answered (see auth_request below).
# Empty for an anonymous visitor, and an empty header is not sent at all, which
# also discards any X-Suite-User the browser sent itself.
proxy_set_header X-Suite-User      $suite_user;
# This sign-in's id, the same while signed in and new with every sign-in, for
# what a tool keeps until signing out (the editor's open tabs).
proxy_set_header X-Suite-Session   $suite_session;
proxy_read_timeout 300s;

# The proxy's own health, for Docker's health check, over plain http on a port
# that is not published: it says "healthy" and nothing more.
server {
    listen 127.0.0.1:8081;
    location = /suite-health {
        default_type application/json;
        return 200 '{"status":"healthy","proxy":"nginx"}';
    }
    location / { return 404; }
}

# The suite, over https. The certificate is the machine's, signed by the lab's
# own certificate authority (scripts/make-certs.sh); computers trust that
# authority once (docs/HTTPS.md). A university certificate goes in the same
# two files instead.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/suite.crt;
    ssl_certificate_key /etc/nginx/certs/suite.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:suite_tls:10m;
    ssl_session_timeout 1d;
    # Plain http to this port (an old bookmark, http://host:8080/) is answered
    # by going to the same address over https.
    error_page 497 =301 https://$http_host$request_uri;
    # Redirects say only the path, so the browser keeps whatever host and port
    # it came in on (the suite's port, or a proxy in front), not this port 443.
    absolute_redirect off;

    # The lab's certificate authority, to download and trust before signing in.
    # A certificate is public: it holds no key.
    location = /lab-suite-ca.crt {
        auth_request off;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="lab-suite-ca.crt"';
        alias /etc/nginx/certs/lab-suite-ca.crt;
    }

    # ---- one sign-in for the suite -----------------------------------------
    # Every request is checked, so a tool added below is behind the sign-in and
    # gets the signed-in user without anything more here. Anonymous visitors
    # are refused everywhere but the sign-in pages and the tools' health checks
    # (the sign-in service keeps that list): a page visit goes to the sign-in
    # page and comes back afterwards, an API call gets a 401. If the sign-in
    # service is down, everything behind it answers 500 rather than letting
    # anyone through.
    auth_request     /_suite_auth;
    auth_request_set $suite_user $upstream_http_x_suite_user;
    auth_request_set $suite_session $upstream_http_x_suite_session;
    error_page 401 = @suite_signin;

    location = /_suite_auth {
        internal;
        auth_request off;
        set $portal_upstream http://portal:5003;
        proxy_pass $portal_upstream/api/check;
        proxy_pass_request_body off;
        # Setting any header here replaces the inherited ones, so the ones
        # this check needs are given again.
        proxy_set_header Content-Length "";
        proxy_set_header Host           $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Suite-User   "";
        proxy_set_header X-Suite-Session "";
    }

    # What a refused visitor gets instead: the sign-in service decides between
    # the sign-in page (for a page visit) and a 401 (for an API call).
    location @suite_signin {
        auth_request off;
        set $portal_upstream http://portal:5003;
        rewrite ^ /api/signin break;
        proxy_pass $portal_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host           $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Suite-User   "";
        proxy_set_header X-Suite-Session "";
    }

    # ---- sign-in, registration and the dashboard --------------------------
    # Tries at signing in and registering, limited (suite_signin above).
    location ~ ^/account/(api/)?(login|register)$ {
        auth_request off;
        limit_req zone=suite_signin burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @suite_slow_down;
        set $portal_upstream http://portal:5003;
        rewrite ^/account/?(.*)$ /$1 break;
        proxy_pass $portal_upstream;
    }
    # Said so the sign-in and registration pages can show it.
    location @suite_slow_down {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too many tries from this address. Wait a minute, then try again."}';
    }
    location /account/ {
        auth_request off;
        set $portal_upstream http://portal:5003;
        rewrite ^/account/?(.*)$ /$1 break;
        proxy_pass $portal_upstream;
    }
    location = /account {
        return 301 /account/;
    }

    # ---- landing page ------------------------------------------------------
    # Exactly "/" only, so the MoClo tool keeps every other root path. Behind
    # the sign-in like everything else, so the tools are not even listed to
    # someone who has not signed in.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /tools.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Health of the suite itself, distinct from each tool's own /health.
    location = /suite-health {
        auth_request off;
        default_type application/json;
        return 200 '{"status":"healthy","proxy":"nginx"}';
    }

    # ---- Plasmid Editor ----------------------------------------------------
    # The full /editor/... path is passed through; the app moves the prefix
    # into SCRIPT_NAME itself (URL_PREFIX), so no rewriting happens here.
    location /editor/ {
        set $editor_upstream http://editor:5001;
        proxy_pass $editor_upstream;
    }
    location = /editor {
        return 301 /editor/;
    }

    # ---- Lab Notebook ------------------------------------------------------
    # Like the editor: the full path is passed through, and the app moves the
    # prefix itself (URL_PREFIX=/notebook).
    location /notebook/ {
        set $notebook_upstream http://notebook:5004;
        proxy_pass $notebook_upstream;
    }
    location = /notebook {
        return 301 /notebook/;
    }

    # ---- Seed Bank ---------------------------------------------------------
    location /seeds/ {
        set $seeds_upstream http://seeds:5005;
        proxy_pass $seeds_upstream;
        # Photos and 3D scans of plants can be large.
        client_max_body_size 210m;
    }
    location = /seeds {
        return 301 /seeds/;
    }

    # ---- Lab Stocks --------------------------------------------------------
    location /stocks/ {
        set $stocks_upstream http://stocks:5006;
        proxy_pass $stocks_upstream;
        # Photos and files on stocks; the app allows 64 MB.
        client_max_body_size 65m;
    }
    location = /stocks {
        return 301 /stocks/;
    }

    location /booking/ {
        set $booking_upstream http://booking:5007;
        proxy_pass $booking_upstream;
    }
    location = /booking {
        return 301 /booking/;
    }

    # ---- One registration for the whole suite ------------------------------
    # Accounts are shared, so there is one sign-up page: the suite's, which
    # asks for the lab and the lab's registration code (generated, and shown to
    # administrators and lab leads, on the dashboard at /account/). The tools send people
    # there themselves; these blocks do the same here as well, so the codes
    # cannot be bypassed even with an older tool pinned. Administrators can
    # still add accounts from MoClo's admin dashboard.
    location = /register {
        return 302 /account/register;
    }
    location = /api/auth/register {
        default_type application/json;
        return 403 '{"error":"Accounts are created on the lab registration page, /account/register, which asks for the lab registration code."}';
    }
    location = /editor/api/auth/register {
        default_type application/json;
        return 403 '{"error":"Accounts are created on the lab registration page, /account/register, which asks for the lab registration code."}';
    }

    # ---- Backup console ----------------------------------------------------
    # An administrative interface: it can overwrite the lab's databases, so it
    # requires an administrator sign-in. Restrict it further here if you want
    # it reachable only from inside the building, for example:
    #   allow 192.168.0.0/16; deny all;
    # It is served at its own root, so the prefix is stripped before proxying.
    location /backup/ {
        set $backup_upstream http://backup-console:5002;
        rewrite ^/backup/?(.*)$ /$1 break;
        proxy_pass $backup_upstream;
        # Archives travel in both directions and can be large.
        client_max_body_size 2g;
        proxy_request_buffering off;
    }
    location = /backup {
        return 301 /backup/;
    }

    # ---- MoClo Library Tool (catch-all) ------------------------------------
    location / {
        set $moclo_upstream http://moclo:5000;
        proxy_pass $moclo_upstream;
    }
}
