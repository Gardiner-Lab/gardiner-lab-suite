# Routing for the Gardiner Lab tool suite.
#
# The MoClo Library Tool writes absolute links (href="/parts",
# fetch('/api/backbones')), so it keeps the whole root namespace and needs no
# changes and no response rewriting. Every other tool is carved out under its
# own prefix and is told about that prefix, so its own links come out right.
#
#   =/            landing page (static)
#   /editor/      Plasmid Editor   (URL_PREFIX=/editor)
#   /             MoClo Library Tool (catch-all)
#
# To add a tool: add a service to docker-compose.yml, copy the /editor block
# below and change the prefix and upstream, then add an entry to
# landing/tools.json. Put new blocks ABOVE the catch-all.

upstream moclo   { server moclo:5000; }
upstream editor  { server editor:5001; }

# Long sequences and chromatograms travel in request bodies.
client_max_body_size 64m;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;

server {
    listen 80;
    server_name _;

    # ---- landing page ------------------------------------------------------
    # Exactly "/" only, so the MoClo tool keeps every other root path.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /tools.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Health of the suite itself, distinct from each tool's own /health.
    location = /suite-health {
        default_type application/json;
        return 200 '{"status":"healthy","proxy":"nginx"}';
    }

    # ---- Plasmid Editor ----------------------------------------------------
    # The full /editor/... path is passed through; the app moves the prefix
    # into SCRIPT_NAME itself (URL_PREFIX), so no rewriting happens here.
    location /editor/ {
        proxy_pass http://editor;
    }
    location = /editor {
        return 301 /editor/;
    }

    # ---- MoClo Library Tool (catch-all) ------------------------------------
    location / {
        proxy_pass http://moclo;
    }
}
