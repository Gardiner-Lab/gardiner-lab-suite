name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sign-in and backup service tests
        run: |
          pip install flask bcrypt pytest
          pytest -q portal/ backup/

      - name: Shell scripts
        run: |
          bash -n install.sh
          shellcheck --severity=error install.sh backup/*.sh scripts/*.sh

      - name: Compose files
        run: |
          SECRET_KEY=x MOCLO_SECRET_KEY=x docker compose config --quiet
          SECRET_KEY=x MOCLO_SECRET_KEY=x docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet

      - name: Proxy configuration
        run: |
          # The real certificate is made on the lab's server (scripts/make-certs.sh)
          # and never committed; a throwaway one lets nginx check the https setup.
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/certs/suite.key" -out "$RUNNER_TEMP/certs/suite.crt" 2>/dev/null
          docker run --rm --add-host moclo:127.0.0.1 --add-host editor:127.0.0.1 \
            --add-host backup-console:127.0.0.1 --add-host portal:127.0.0.1 \
            --add-host notebook:127.0.0.1 --add-host seeds:127.0.0.1 --add-host stocks:127.0.0.1 --add-host booking:127.0.0.1 \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/certs:/etc/nginx/certs:ro" nginx:1.27-alpine nginx -t

      - name: Every pinned image exists
        run: |
          for image in $(SECRET_KEY=x MOCLO_SECRET_KEY=x docker compose --profile restore config --images | sort -u); do
            case "$image" in *lab-suite-*) continue ;; esac   # published by this repo's release
            docker manifest inspect "$image" > /dev/null && echo "ok  $image" || { echo "MISSING $image"; exit 1; }
          done
